<!doctype html>
<!-- Source for the app icons. Screenshot #icon at 512x512; see the note in README. -->
<meta charset="utf-8">
<style>
  html,body{margin:0;background:#0d2330}
  #icon{width:512px;height:512px;display:grid;place-items:center;
        background:radial-gradient(120% 120% at 50% 0%, #1b4257, #0d2330 70%)}
  /* Maskable icons get cropped to a circle on Android, so keep the drum well inside
     the safe zone (the middle 80%). */
  #icon span{font-size:300px;line-height:1;filter:drop-shadow(0 10px 24px #0009)}
</style>
<div id="icon"><span>🥁</span></div>
